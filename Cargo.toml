[package]
name = "stickynote"
version = "0.2.0"
edition = "2024"
description = "A terminal-based sticky notes board with markdown, tags, and mouse support"
license = "MIT"
repository = "https://github.com/narqulie/stickynote"
keywords = ["sticky-notes", "tui", "notes", "terminal", "ratatui"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
arboard = "3"
